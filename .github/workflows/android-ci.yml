name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and Android packages
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://slwzjufipavuwcbwoyro.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ef-LNkOiNzxg_9d0b1To4Q_awu1BoV7
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android public client values
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID"
          } > local.properties
          {
            printf 'FIREBASE_APP_ID=%s\n' "$FIREBASE_APP_ID"
            printf 'FIREBASE_API_KEY=%s\n' "$FIREBASE_API_KEY"
            printf 'FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID"
            printf 'FIREBASE_SENDER_ID=%s\n' "$FIREBASE_SENDER_ID"
          } >> local.properties
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID repository variable is not configured; Google sign-in will remain unavailable in this APK."
          fi
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_SENDER_ID" ]; then
            echo "::warning::Firebase variables are missing; push notifications are disabled in this build."
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Generate official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          chmod +x gradlew

      - name: Persist official Gradle Wrapper on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper is already committed."
            exit 0
          fi
          git commit -m "build(android): add official Gradle wrapper"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Inspect lifecycle runtime Compose dependency path
        run: ./gradlew --no-daemon :android:app:dependencyInsight --dependency lifecycle-runtime-compose --configuration debugRuntimeClasspath

      - name: Run Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK and AAB
        run: ./gradlew --no-daemon assembleDebug bundleDebug

      - name: Upload Android outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaveh-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/debug/*.aab
            gradlew
            gradle/wrapper/*
          if-no-files-found: warn
          retention-days: 30
