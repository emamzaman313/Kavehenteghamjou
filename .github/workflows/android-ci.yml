name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and Android packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Generate official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK and AAB
        run: ./gradlew --no-daemon assembleDebug bundleDebug

      - name: Upload Android outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaveh-android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/debug/*.aab
            gradlew
            gradle/wrapper/*
          if-no-files-found: warn
          retention-days: 30
