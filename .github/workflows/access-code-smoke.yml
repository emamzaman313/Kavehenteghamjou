name: Access code smoke test

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/access-code-login/**"
      - ".github/workflows/access-code-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-code-smoke:
    name: Verify Edge Function CORS and status
    runs-on: ubuntu-latest
    steps:
      - name: Check required public key variable
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY repository variable is missing"
            exit 1
          }

      - name: Verify production-origin preflight
        env:
          FUNCTION_URL: https://slwzjufipavuwcbwoyro.supabase.co/functions/v1/access-code-login
          SITE_ORIGIN: https://kaveh-avenger.vercel.app
        run: |
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
            -X OPTIONS "$FUNCTION_URL" \
            -H "Origin: $SITE_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization, apikey, content-type, x-client-info")"
          test "$status" = "200" || {
            echo "Production CORS preflight returned HTTP $status"
            cat "$body"
            exit 1
          }
          grep -iF "access-control-allow-origin: $SITE_ORIGIN" "$headers"
          grep -iF "POST, OPTIONS" "$headers"

      - name: Verify opaque-origin preflight compatibility
        env:
          FUNCTION_URL: https://slwzjufipavuwcbwoyro.supabase.co/functions/v1/access-code-login
        run: |
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' \
            -X OPTIONS "$FUNCTION_URL" \
            -H "Origin: null" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization, apikey, content-type")"
          test "$status" = "200" || {
            echo "Opaque-origin preflight returned HTTP $status"
            cat "$body"
            exit 1
          }
          grep -iF "access-control-allow-origin: null" "$headers"

      - name: Verify live feature status
        env:
          FUNCTION_URL: https://slwzjufipavuwcbwoyro.supabase.co/functions/v1/access-code-login
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SITE_ORIGIN: https://kaveh-avenger.vercel.app
        run: |
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST "$FUNCTION_URL" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Origin: $SITE_ORIGIN" \
            -H "Content-Type: application/json" \
            --data '{"action":"status"}')"
          test "$status" = "200" || {
            echo "Live status request returned HTTP $status"
            cat "$body"
            exit 1
          }
          jq -e '.ok == true and .enabled == true' "$body" >/dev/null
          echo "CORS and live access-code status checks passed."
