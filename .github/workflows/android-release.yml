name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed Android Release APK and AAB
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://slwzjufipavuwcbwoyro.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ef-LNkOiNzxg_9d0b1To4Q_awu1BoV7
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Validate signing and OAuth configuration
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret $name is missing. See docs/android-release-signing.md."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID is not configured; Google Sign-in will not be enabled in this release."
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kaveh-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/kaveh-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID"
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/kaveh-release.jks"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
          } > local.properties

      - name: Run Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed Release APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify signatures and generate checksums
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -n "$APK" && test -n "$AAB"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          sha256sum "$APK" "$AAB" > android/app/build/outputs/SHA256SUMS
          cat android/app/build/outputs/SHA256SUMS

      - name: Upload signed Release outputs
        uses: actions/upload-artifact@v4
        with:
          name: kaveh-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
