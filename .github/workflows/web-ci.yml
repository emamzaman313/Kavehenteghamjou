name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Upgrade npm to a resolver version compatible with the lockfile graph
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Require committed npm lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::web/package-lock.json must be committed; CI never generates or pushes lockfiles."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload web build and npm lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaveh-web-build
          path: |
            web/.next
            web/package-lock.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
