<!doctype html>
<html lang="fa" dir="rtl">
  <body style="margin:0;padding:32px;background:#080d18;color:#eef3ff;font-family:Tahoma,Arial,sans-serif">
    <main style="max-width:480px;margin:0 auto;padding:28px;border:1px solid #24344d;border-radius:18px;background:#101a2b">
      <h2 style="margin:0 0 16px">کد ورود به کاوه انتقامجو</h2>
      <p style="line-height:1.9">برای ورود یا ساخت حساب، کد زیر را در صفحه ورود سایت وارد کنید:</p>
      <p dir="ltr" style="margin:24px 0;padding:18px;text-align:center;border-radius:12px;background:#07101f;color:#69b7ff;font-size:32px;font-weight:700;letter-spacing:10px">{{ .Token }}</p>
      <p style="line-height:1.9;color:#b8c5d9">این کد یک‌بارمصرف است. آن را با دیگران به اشتراک نگذارید. اگر شما درخواست ورود نداده‌اید، این ایمیل را نادیده بگیرید.</p>
      <p style="margin-top:24px;color:#7f91aa;font-size:12px">کاوه انتقامجو · فضای ارتباطی مستقل</p>
    </main>
  </body>
</html>
